<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<div class="ckc-map-embed" data-map-artifact="6d5ae51d0bbf7cd2">
  <style>
    .ckc-map-embed { font-family: Arial, sans-serif; color: #1f2a36; max-width: 100%; }
    .ckc-map-embed * { box-sizing: border-box; }
    .ckc-map-embed__title { font-weight: 800; font-size: 20px; line-height: 1.2; margin: 0 0 8px; }
    .ckc-map-embed__canvas { width: 100%; height: 520px; border: 1px solid #c3ccd5; background: #eef2f3; }
    .ckc-map-embed__status { font-size: 13px; line-height: 1.35; margin-top: 8px; color: #34465a; min-height: 18px; }
    .ckc-map-embed__note { font-size: 12px; line-height: 1.35; margin-top: 8px; color: #5a6877; }
    @media (max-width: 640px) { .ckc-map-embed__canvas { height: 390px; } }
  </style>
  <div class="ckc-map-embed__title">CompassKC demolition map: CH-DM-2026-00027</div>
  <div class="ckc-map-embed__canvas"></div>
  <div class="ckc-map-embed__status">Loading map...</div>
  <div class="ckc-map-embed__note">Source: CompassKC and KCMO parcel data. Building footprints, when available, are clipped from Overture Maps building data; attribution: OpenStreetMap contributors and Overture Maps Foundation. Footprints may lag current conditions.</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  var script = document.currentScript;
  var wrapper = script && script.previousElementSibling;
  while (wrapper && !wrapper.classList.contains("ckc-map-embed")) {
    wrapper = wrapper.previousElementSibling;
  }
  if (!wrapper) return;
  var canvas = wrapper.querySelector(".ckc-map-embed__canvas");
  var status = wrapper.querySelector(".ckc-map-embed__status");
  function setStatus(message) { if (status) status.textContent = message || ""; }
  function esc(value) {
    return String(value || "").replace(/[&<>"']/g, function (ch) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" })[ch];
    });
  }
  function safeUrl(value) {
    value = String(value || "");
    return /^https?:\/\//i.test(value) ? value.replace(/"/g, "%22") : "";
  }
  if (!canvas) return;
  if (typeof L === "undefined") {
    setStatus("Map library failed to load.");
    return;
  }
  var map = L.map(canvas, { scrollWheelZoom: false });
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
    subdomains: "abcd",
    maxZoom: 20,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
  }).addTo(map);
  function featureBounds(feature) {
    try {
      var bounds = L.geoJSON(feature).getBounds();
      return bounds && bounds.isValid && bounds.isValid() ? bounds : null;
    } catch (err) {
      return null;
    }
  }
  function featureCenter(feature) {
    var geom = feature && feature.geometry ? feature.geometry : {};
    if (geom.type === "Point" && Array.isArray(geom.coordinates)) {
      return L.latLng(geom.coordinates[1], geom.coordinates[0]);
    }
    var bounds = featureBounds(feature);
    return bounds ? bounds.getCenter() : null;
  }
  function matchMessage(props, geomType) {
    var status = String(props.match_status || "");
    var method = String(props.match_method || "");
    if (status === "matched" && method === "parcel_id") return "Parcel polygon matched by parcel ID.";
    if (status === "matched" && method) return "Parcel geometry matched by " + method.replace(/_/g, " ") + ".";
    if (geomType === "Point") return "Point-only fallback: no parcel polygon was available.";
    return "";
  }
  function latLng(point) {
    return [point[1], point[0]];
  }
  function latLngRing(ring) {
    return ring.map(latLng);
  }
  function popupHtml(feature) {
    var props = feature.properties || {};
    var bits = [];
    var detailUrl = safeUrl(props.detail_url);
    if (props.case_number) bits.push("<strong>" + esc(props.case_number) + "</strong>");
    if (props.address) bits.push(esc(props.address));
    if (props.record_type) bits.push(esc(props.record_type));
    if (detailUrl) bits.push('<a href="' + detailUrl + '" target="_blank" rel="noopener">CompassKC detail</a>');
    return bits.join("<br>");
  }
  function parseBuildingPayload(value) {
    if (!value) return null;
    if (typeof value === "string") {
      try { return JSON.parse(value); } catch (err) { return null; }
    }
    return value;
  }
  function buildingFeaturesFor(feature) {
    var props = feature && feature.properties ? feature.properties : {};
    var payload = parseBuildingPayload(props.building_footprints);
    var features = payload && Array.isArray(payload.features) ? payload.features : (Array.isArray(payload) ? payload : []);
    return features.filter(function (building) {
      return building && building.type === "Feature" && building.geometry;
    }).map(function (building) {
      var clone = {
        type: "Feature",
        geometry: building.geometry,
        properties: Object.assign({}, building.properties || {})
      };
      clone.properties.parent_case_number = props.case_number || "";
      return clone;
    });
  }
  function buildingPopupHtml(feature) {
    var props = feature.properties || {};
    var bits = ["<strong>Building footprint</strong>"];
    if (props.parent_case_number) bits.push("Permit: " + esc(props.parent_case_number));
    bits.push("Source: Overture Maps" + (props.source_release ? " " + esc(props.source_release) : ""));
    bits.push('<span style="color:#5a6877">Open footprint data may lag current conditions.</span>');
    return bits.join("<br>");
  }
  function addBuildingFootprints(group, feature) {
    var buildings = buildingFeaturesFor(feature);
    if (!buildings.length) return 0;
    L.geoJSON({ type: "FeatureCollection", features: buildings }, {
      style: function () { return { color: "#27313d", weight: 1, fillColor: "#27313d", fillOpacity: 0.18, opacity: 0.75 }; },
      onEachFeature: function (building, buildingLayer) {
        buildingLayer.bindPopup(buildingPopupHtml(building));
      }
    }).addTo(group);
    return buildings.length;
  }
  function addPermitMarker(group, feature) {
    var center = featureCenter(feature);
    if (!center) return;
    L.circleMarker(center, { radius: 8, color: "#ffffff", weight: 2, fillColor: "#c23b3b", fillOpacity: 0.95 }).bindPopup(popupHtml(feature)).addTo(group);
  }
  function addFeatureToGroup(group, feature) {
    var geom = feature && feature.geometry ? feature.geometry : {};
    var polygonStyle = { color: "#111827", weight: 3, fillColor: "#2f6fbb", fillOpacity: 0.26, opacity: 1 };
    if (geom.type === "Point" && Array.isArray(geom.coordinates)) {
      addPermitMarker(group, feature);
      return 0;
    }
    if (geom.type === "Polygon" && Array.isArray(geom.coordinates)) {
      L.polygon(geom.coordinates.map(latLngRing), polygonStyle).bindPopup(popupHtml(feature)).addTo(group);
      var polygonBuildings = addBuildingFootprints(group, feature);
      addPermitMarker(group, feature);
      return polygonBuildings;
    }
    var buildingCount = 0;
    if (geom.type === "MultiPolygon" && Array.isArray(geom.coordinates)) {
      geom.coordinates.forEach(function (polygon) {
        L.polygon(polygon.map(latLngRing), polygonStyle).bindPopup(popupHtml(feature)).addTo(group);
      });
      buildingCount = addBuildingFootprints(group, feature);
      addPermitMarker(group, feature);
    }
    return buildingCount;
  }
  fetch("https://mcclatchyai.github.io/newsroom-data/maps/compasskc-map-artifacts/v1/prod/artifacts/6d/6d5ae51d0bbf7cd2/data.geojson")
    .then(function (response) {
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.json();
    })
    .then(function (geojson) {
      var features = geojson && geojson.features ? geojson.features : [];
      if (!features.length) {
        map.setView([39.0997, -94.5786], 11);
        setStatus("No map geometry is available for this permit.");
        return;
      }
      var layer = L.featureGroup().addTo(map);
      var first = features[0] || {};
      var firstGeom = first.geometry || {};
      var buildingCount = 0;
      features.forEach(function (feature) { buildingCount += addFeatureToGroup(layer, feature); });
      try {
        map.fitBounds(layer.getBounds(), { padding: [24, 24], maxZoom: 18 });
      } catch (err) {
        map.setView([39.0997, -94.5786], 11);
      }
      var props = first.properties || {};
      var message = matchMessage(props, firstGeom.type);
      if (buildingCount) {
        message += " " + buildingCount + " building footprint" + (buildingCount === 1 ? " is" : "s are") + " shown from Overture Maps.";
      }
      setStatus(message);
      setTimeout(function () { map.invalidateSize(); }, 300);
    })
    .catch(function (err) {
      map.setView([39.0997, -94.5786], 11);
      setStatus("Map data failed to load: " + err.message);
    });
})();
</script>
