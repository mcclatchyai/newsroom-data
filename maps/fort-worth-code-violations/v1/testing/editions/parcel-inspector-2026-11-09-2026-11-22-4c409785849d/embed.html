<div class="fw-parcel-inspection" style="max-width:1120px;margin:0 auto"><iframe title="Explore Fort Worth parcels and code violation records" src="https://mcclatchyai.github.io/newsroom-data/maps/fort-worth-code-violations/v1/testing/editions/parcel-inspector-2026-11-09-2026-11-22-4c409785849d/index.html" width="100%" height="900" loading="lazy" style="display:block;width:100%;border:0"></iframe><p><a href="https://mcclatchyai.github.io/newsroom-data/maps/fort-worth-code-violations/v1/testing/editions/parcel-inspector-2026-11-09-2026-11-22-4c409785849d/index.html">Open the full parcel and code violation map</a></p></div><script>(() => {
  const wrap=document.currentScript?.previousElementSibling;
  if(!wrap?.classList.contains('fw-parcel-inspection'))return;
  const frame=wrap.querySelector('iframe'), origin=new URL(frame.src).origin;
  window.addEventListener('message',event=>{
    if(event.source===frame.contentWindow && event.origin===origin &&
       event.data?.type==='fw-inspector-height' && Number.isFinite(event.data.height)){
      frame.style.height=Math.min(20000,Math.max(540,Math.ceil(event.data.height)))+'px';
    }
  });
})();</script>
