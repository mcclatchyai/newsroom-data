    function newsContext(news) {
      news = news && typeof news === "object" ? news : {};
      var results = Array.isArray(news.results) ? news.results : [];
      if (!results.length) return '<div class="empty-state"><strong>No news/event links returned.</strong><p>' + esc(news.reason || news.status || "no source links returned") + "</p></div>";
      var items = results.slice(0, 6).map(function (row) {
        var ranked = Array.isArray(row.why_ranked) ? row.why_ranked.join("; ") : text(row.why_included);
        return "<li>" + (safeUrl(row.url) ? link(row.url, row.title || row.url) : esc(row.title || "Context link"))
          + '<span class="source-meta">' + esc(row.domain || "source unknown") + (row.published_at ? " | " + esc(row.published_at) : "") + "</span>"
          + '<span class="source-meta">Relevance: ' + esc(row.relevance_label || "-") + (row.relevance_score !== undefined ? " (" + esc(row.relevance_score) + "/100)" : "") + " | Source type: " + esc(row.source_type || "-") + "</span>"
          + '<span class="source-note">' + esc(ranked) + "</span></li>";
      }).join("");
      return '<div class="news-context"><p><strong>Query:</strong> ' + esc(news.query || "-") + '</p><ul>' + items + '</ul><p class="market-note">' + esc(news.reporter_note || "Review these links before using them in a story.") + "</p></div>";
    }
    function storyHook(payload) {
      var candidate = payload && payload.insight_candidate && typeof payload.insight_candidate === "object" ? payload.insight_candidate : {};
      if (!Object.keys(candidate).length) {
        return '<div class="empty-state"><strong>No story hook generated.</strong><p>The trade JSON does not include an insight candidate yet.</p></div>';
      }
      var starter = candidate.article_starter && typeof candidate.article_starter === "object" ? candidate.article_starter : {};
      var market = candidate.market_context && typeof candidate.market_context === "object" ? candidate.market_context : {};
      var news = candidate.news_context && typeof candidate.news_context === "object" ? candidate.news_context : {};
      var checks = Array.isArray(candidate.reporter_checks) ? candidate.reporter_checks.slice(0, 5) : [];
      var reasons = Array.isArray(candidate.score_reasons) ? candidate.score_reasons.slice(0, 5) : [];
      var checksHtml = checks.length ? checks.map(function (item) { return "<li>" + esc(item) + "</li>"; }).join("") : "<li>Confirm the source disclosure PDF.</li>";
      var reasonsHtml = reasons.length ? reasons.map(function (item) { return "<li>" + esc(item) + "</li>"; }).join("") : "<li>No scoring reasons exported.</li>";
      return '<div class="story-hook">'
        + '<div><p class="eyebrow">Automated reporter lead | Score ' + esc(candidate.score || 0) + '</p><h3>' + esc(candidate.headline || "Story hook") + '</h3><p>' + esc(candidate.dek || starter.lede || candidate.grounded_summary || "") + "</p></div>"
        + '<div class="return-grid">'
        + field("Trade to filing", pct(market.percent_change_trade_to_filing))
        + field("Trade to latest", pct(market.percent_change_trade_to_latest))
        + field("News links", news.result_count !== undefined ? news.result_count : "-")
        + "</div>"
        + '<details open><summary>Grounded starter</summary><p>' + esc(candidate.grounded_summary || starter.lede || "") + "</p></details>"
        + '<details><summary>Why it surfaced</summary><ul>' + reasonsHtml + "</ul></details>"
        + '<details><summary>Reporter checks</summary><ul>' + checksHtml + "</ul></details>"
        + '<p class="market-note">This is a lead-generation frame, not publication-ready copy.</p>'
        + "</div>";
    }
    function evidenceContext(evidence) {
      evidence = evidence && typeof evidence === "object" ? evidence : {};
      if (!Object.keys(evidence).length) return '<div class="empty-state"><strong>Evidence context unavailable.</strong><p>No evidence context was exported for this trade.</p></div>';
      var sec = evidence.sec_issuer_identity || {};
      var committees = evidence.member_committee_context || {};
      var usaspending = evidence.usaspending_context || {};
      var lda = evidence.lda_context || {};
      var flags = evidence.reporter_flags || {};
      var committeeItems = (Array.isArray(committees.committees) ? committees.committees : []).slice(0, 5).map(function (row) { return "<li>" + esc(row.committee_name || "Committee") + (row.subcommittee_name ? " / " + esc(row.subcommittee_name) : "") + (row.role ? " - " + esc(row.role) : "") + "</li>"; }).join("") || "<li>Committee context unavailable: " + esc(committees.reason || "no records exported") + "</li>";
      var awardItems = (Array.isArray(usaspending.awards) ? usaspending.awards : []).slice(0, 5).map(function (row) { return "<li><strong>" + esc(row.award_id || "Award") + "</strong> " + esc(row.awarding_agency || "") + " " + esc(money(row.award_amount)) + "</li>"; }).join("") || "<li>USAspending context unavailable: " + esc(usaspending.reason || "no awards exported") + "</li>";
      var ldaItems = (Array.isArray(lda.records) ? lda.records : []).slice(0, 5).map(function (row) { return "<li><strong>" + esc(row.client_name || "Client") + "</strong> via " + esc(row.registrant_name || "registrant not listed") + " " + esc(row.filing_year || "") + "</li>"; }).join("") || "<li>LDA context unavailable: " + esc(lda.reason || "no records exported") + "</li>";
      var flagItems = Object.keys(flags).map(function (key) { return "<li><span>" + esc(key.replace(/_/g, " ")) + "</span><strong>" + (flags[key] ? "Yes" : "No") + "</strong></li>"; }).join("") || "<li><span>No reporter flags exported</span><strong>-</strong></li>";
      return '<div class="evidence-grid">'
        + '<section><h3>SEC identity</h3><p><strong>' + esc(sec.ticker || "-") + "</strong> " + esc(sec.sec_title || sec.issuer_name || "") + '</p><p>CIK: ' + esc(sec.cik || "unavailable") + " | confidence: " + esc(sec.confidence !== undefined ? sec.confidence : "-") + "</p></section>"
        + "<section><h3>Committee context</h3><ul>" + committeeItems + "</ul></section>"
        + "<section><h3>USAspending</h3><ul>" + awardItems + "</ul></section>"
        + "<section><h3>Lobbying</h3><ul>" + ldaItems + "</ul>" + link(lda.public_search_url, "Open LDA public search") + "</section>"
        + '<section><h3>Reporter flags</h3><ul class="flag-list">' + flagItems + "</ul></section>"
        + "</div>";
    }
    function policyContext(policy) {
      policy = policy && typeof policy === "object" ? policy : {};
      if (!Object.keys(policy).length) return '<div class="empty-state"><strong>Congress/policy context unavailable.</strong><p>No policy context was exported for this trade.</p></div>';
      var overlap = policy.committee_issuer_overlap_status || {};
      var jurisdiction = policy.committee_jurisdiction_context || {};
      var bills = policy.congressgov_bills || {};
      var hearings = policy.congressgov_hearings || {};
      var terms = Array.isArray(policy.issuer_policy_terms) ? policy.issuer_policy_terms : [];
      var termItems = terms.slice(0, 10).map(function(row) { return "<li>" + esc(row.term || row) + '<span class="source-meta">' + esc(row.source || "derived") + "</span></li>"; }).join("") || "<li>No issuer policy terms exported.</li>";
      var committeeItems = (Array.isArray(jurisdiction.matched_committees) ? jurisdiction.matched_committees : []).slice(0, 5).map(function(row) { return "<li>" + esc(row.committee_name || "Committee") + (row.subcommittee_name ? " / " + esc(row.subcommittee_name) : "") + '<span class="source-note">Matched terms: ' + esc((row.matched_issuer_terms || []).join(", ") || "-") + "</span></li>"; }).join("") || "<li>No committee/issuer overlap found in this automated pass.</li>";
      var billItems = (Array.isArray(bills.items) ? bills.items : []).slice(0, 5).map(function(row) { return "<li>" + (safeUrl(row.congressgov_url || row.api_url) ? link(row.congressgov_url || row.api_url, (row.type || "") + " " + (row.number || "") + ": " + (row.title || "Bill")) : esc(row.title || "Bill")) + '<span class="source-note">Matched terms: ' + esc((row.matched_terms || []).join(", ") || "-") + "</span></li>"; }).join("") || "<li>No matching recent bills exported.</li>";
      var hearingItems = (Array.isArray(hearings.items) ? hearings.items : []).slice(0, 5).map(function(row) { return "<li>" + esc(row.title || "Committee meeting") + '<span class="source-meta">' + esc(row.chamber || "-") + (row.date ? " | " + esc(row.date) : "") + '</span><span class="source-note">Matched terms: ' + esc((row.matched_terms || []).join(", ") || "-") + "</span></li>"; }).join("") || "<li>No matching recent hearings exported.</li>";
      return '<div class="evidence-grid">'
        + '<section><h3>Overlap status</h3><p><strong>' + esc(overlap.status || policy.status || "unavailable") + "</strong></p><p>" + esc(overlap.summary || "Verify any committee/company relationship manually.") + "</p></section>"
        + "<section><h3>Issuer policy terms</h3><ul>" + termItems + "</ul></section>"
        + "<section><h3>Committee matches</h3><ul>" + committeeItems + "</ul></section>"
        + "<section><h3>Congress.gov bills</h3><ul>" + billItems + "</ul>" + link(bills.public_search_url, "Open Congress.gov bill search") + "</section>"
        + "<section><h3>Congress.gov hearings</h3><ul>" + hearingItems + "</ul>" + link(hearings.public_search_url, "Open Congress.gov hearing search") + "</section>"
        + "</div>";
    }
    function render(payload, filingPayload) {
      var tx = payload.transaction || {};
      var filing = payload.filing || {};
      var market = payload.market_context || {};
      var metadata = payload.public_metadata || {};
      var txId = text(tx.transaction_id);
      var filingId = text(tx.filing_id || filing.filing_id);
      var action = text(tx.action || "Transaction");
      var ticker = text(tx.ticker);
      var title = (text(tx.member_name) || "Congressional filer") + " reported " + action.toLowerCase() + " of " + (ticker || text(tx.issuer_name) || "asset");
      var pdfUrl = text(tx.pdf_url || filing.pdf_url);
      var lag = text(tx.disclosure_lag_days);
      var sourceQuote = text(tx.source_quote) ? '<p class="source-quote"><strong>Source quote:</strong> ' + esc(tx.source_quote) + "</p>" : "";
      var metrics = field("Amount range", tx.amount_range) + field("Owner", tx.owner) + field("Trade date", dateLabel(tx.transaction_date)) + field("Filing date", dateLabel(tx.filing_date || filing.filing_date)) + field("Reporting lag", lag ? lag + " days" : "-") + field("Page", tx.page);
      main.innerHTML = '<header class="hero">'
        + '<section class="lede-card"><p class="eyebrow">PTR trade detail | Filing #' + esc(filingId) + '</p><h1>' + esc(title) + '</h1><p><span class="badge ' + esc(actionType(action)) + '">' + esc(action) + "</span></p><p>" + esc(tx.issuer_name || "Issuer not listed") + (ticker ? " (" + esc(ticker) + ")" : "") + "</p>" + sourceQuote + link(pdfUrl, "Open source disclosure PDF") + "</section>"
        + '<aside class="side-card lede-card"><p class="eyebrow">Reported by</p><h2>' + esc(tx.member_name || filing.member_name || "Unknown filer") + '</h2><div class="metrics">' + field("State", tx.state || filing.state) + field("District", tx.district || filing.district) + field("Ticker", tx.ticker) + field("Trade ID", txId) + "</div></aside>"
        + '</header><section class="panel"><h2>Trade card</h2><div class="metrics">' + metrics + "</div></section>"
        + '<section class="panel"><h2>Story hook for reporters</h2>' + storyHook(payload) + "</section>"
        + renderChart(market, tx)
        + '<section class="panel"><h2>Top news/event links to check</h2>' + newsContext(payload.news_context) + "</section>"
        + '<section class="panel"><h2>Same filing</h2>' + sameFilingTable(filingPayload || {}, txId) + "</section>"
        + '<section class="panel"><h2>Evidence context</h2>' + evidenceContext(payload.evidence_context) + "</section>"
        + '<section class="panel"><h2>Congress/policy context</h2>' + policyContext(payload.policy_context) + "</section>"
        + '<section class="caveats"><h2>Caveats for reporters</h2><p>Periodic transaction reports are self-reported disclosures. Dollar values are reported in ranges, not exact amounts.</p><p>Market movement and evidence context are reporter checks only. This page does not establish motive, intent, profit, or use of nonpublic information.</p><p>Data refreshed: ' + esc(metadata.generated_at || "-") + ". Cache TTL: " + esc(metadata.cache_ttl_seconds || "-") + " seconds. Readers fetch this static JSON, not paid APIs.</p></section>";
    }
    function fetchJson(url) {
      return fetch(withVersion(url), {cache: "default"}).then(function (response) {
        if (!response.ok) throw new Error("HTTP " + response.status + " for " + url);
        return response.json();
      });
    }
    if (!dataUrl) {
      main.innerHTML = '<section class="empty-state"><strong>Public data URL missing.</strong><p>Set PTR_PUBLIC_BASE_URL or PTR_PUBLIC_BUNDLE_DIR before generating this fetch-mode embed.</p></section>';
      return;
    }
    Promise.all([fetchJson(dataUrl), filingUrl ? fetchJson(filingUrl).catch(function () { return {}; }) : Promise.resolve({})])
      .then(function (payloads) { render(payloads[0] || {}, payloads[1] || {}); })
      .catch(function (error) {
        main.innerHTML = '<section class="empty-state"><strong>Public data could not be loaded.</strong><p>' + esc(error && error.message ? error.message : error) + "</p></section>";
      });
  }());
  </script>
</div>
